name: Build ScriptDeck for Windows

on:
  push:
    branches: [main]
    paths:
      - "scriptdeck.py"
      - ".github/workflows/build-scriptdeck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packager
        run: python -m pip install --upgrade pyinstaller
      - name: Validate source syntax
        run: python -m py_compile scriptdeck.py
      - name: Build ScriptDeck executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ScriptDeck scriptdeck.py
      - name: Upload ScriptDeck
        uses: actions/upload-artifact@v4
        with:
          name: ScriptDeck-Windows
          path: dist/ScriptDeck.exe
          if-no-files-found: error
          retention-days: 30
