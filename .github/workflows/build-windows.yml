name: Build Windows desktop apps

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "macrodesk.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Validate Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile macrodesk.py
      - name: Build LuauDesk
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name LuauDesk app.py
      - name: Build MacroDesk
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MacroDesk --collect-all keyboard --collect-all pyautogui --collect-all pyperclip macrodesk.py
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Apps
          path: |
            dist/LuauDesk.exe
            dist/MacroDesk.exe
          if-no-files-found: error
          retention-days: 30
