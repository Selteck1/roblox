name: Build Luau Desk for Windows

on:
  push:
    branches:
      - main
      - desktop-luau-editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name LuauDesk app.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: LuauDesk-Windows
          path: dist/LuauDesk.exe
          if-no-files-found: error
          retention-days: 14
